name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -r web_portal/requirements.txt requests

      - name: Install Node dependencies
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci

      - name: Run pytest
        run: python -m pytest tests -q

      - name: Run Django scanner tests
        run: |
          cd web_portal
          DJANGO_SECRET_KEY=ci-secret python manage.py test scanner --verbosity=1

      - name: Run frontend JS tests
        run: node tests/test_frontend_js.js

      - name: Run topology JS tests
        run: node tests/test_topology_js.js

      - name: Run installer tests
        run: bash tests/test_installers.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build worker image
        run: docker build -f web_portal/Dockerfile -t wireghost:worker-test .

      - name: Build web image
        run: docker build -f web_portal/Dockerfile.web -t wireghost:web-test .

      - name: Trivy scan worker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'wireghost:worker-test'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Trivy scan web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'wireghost:web-test'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          trivyignores: '.trivyignore'
