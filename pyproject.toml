[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wireghost"
version = "2.0.0"
description = "Wire_Ghost - automated security scanning toolkit"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9,<0.24",
    "rich>=13.0,<14.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
wireghost = "wireghost.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wireghost"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "tests/*",
    "web_portal/scanner/tests/*",
    "web_portal/scanner/migrations/*",
    "scripts/*",
    "ip-reload.py",
]

[tool.ruff.lint]
select = [
    "F",     # pyflakes (catches undefined names, unused imports, etc.)
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "B",     # flake8-bugbear (common bug patterns)
    "RUF100", # flag unused noqa directives
]
ignore = [
    "E402",  # module-import-not-at-top-of-file (lazy/conditional imports are intentional)
    "E501",  # line too long
    "E731",  # lambda-assignment
    "B007",  # unused-loop-control-variable (loop variables intentionally unused)
    "B008",  # function-call-in-default-argument
    "B904",  # raise-without-from-inside-except (existing pattern)
    "B905",  # zip-without-explicit-strict
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
