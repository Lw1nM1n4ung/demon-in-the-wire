[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wireghost"
version = "2.0.0"
description = "Wire_Ghost - automated security scanning toolkit"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9",
    "rich>=13.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "python-gvm>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
wireghost = "wireghost.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wireghost"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
