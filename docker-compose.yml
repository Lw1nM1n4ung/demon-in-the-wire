services:
  # ══════════════════════════════════════
  # WIRE_GHOST — INFRASTRUCTURE
  # ══════════════════════════════════════

  # ── MySQL Database ──
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wireghost}
      MYSQL_USER: ${MYSQL_USER:-wireghost}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    # Internal-only; no host port mapping needed for app use. Enable below to
    # allow direct MySQL access from the host (conflicts with a local mysqld).
    # ports:
    #   - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery broker + result backend) ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ══════════════════════════════════════
  # WIRE_GHOST — APPLICATION
  # ══════════════════════════════════════

  # ── Django REST API ──
  api:
    build:
      context: .
      dockerfile: web_portal/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment: &api-env
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: wireghost
      MYSQL_USER: wireghost
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: wireghost_web.settings
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,${WIREGHOST_HOST:-localhost}"
      WIREGHOST_HOST: ${WIREGHOST_HOST:-localhost}
      WIREGHOST_PORT: ${WIREGHOST_PORT:-9995}
      WIREGHOST_OUTPUT_DIR: /data/output
    volumes: &api-vols
      - scan_output:/data/output
      - report_assets:/data/assets
      - ./src:/app/src:ro
      - ./templates:/opt/nuclei-template-archives:ro
      - ${WIREGHOST_LOG_DIR:-./logs}/api:/app/logs
      # Read-only view of nginx's log directory so the support-bundle
      # endpoint can include portal access/error logs.
      - ${WIREGHOST_LOG_DIR:-./logs}/nginx:/app/logs/nginx:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn wireghost_web.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"]

  # ── Celery Worker (executes scan pipeline) ──
  worker:
    build:
      context: .
      dockerfile: web_portal/Dockerfile
    restart: unless-stopped
    environment: *api-env
    volumes: *api-vols
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A wireghost_web worker -l info -c 2 -Q scans,reports --logfile=/app/logs/celery-worker.log

  # ── Celery Beat (scheduled scan dispatcher) ──
  beat:
    build:
      context: .
      dockerfile: web_portal/Dockerfile
    restart: unless-stopped
    environment: *api-env
    volumes: *api-vols
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A wireghost_web beat -l info --logfile=/app/logs/celery-beat.log

  # ── Web Portal (Nginx) ──
  portal:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # Explicit all-interfaces bind so LAN/VPN/SSH-tunnel clients can reach
      # the portal. Set WIREGHOST_PORT in .env to change the host port; the
      # container always listens on :80 internally. Use 127.0.0.1:$PORT:80
      # if you want host-only access.
      - "0.0.0.0:${WIREGHOST_PORT:-9995}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WIREGHOST_LOG_DIR:-./logs}/nginx:/var/log/nginx
    depends_on:
      - api

  # ══════════════════════════════════════
  # WIRE_GHOST — SCAN TOOLS
  # ══════════════════════════════════════

  wireghost:
    image: callmedemon/wireghost:latest
    build: .
    volumes:
      - scan_output:/data/output
    network_mode: host
    profiles: ["tools"]

  nmap:
    image: instrumentisto/nmap:latest
    volumes:
      - scan_output:/data/output
    network_mode: host
    profiles: ["tools"]

  nuclei:
    image: projectdiscovery/nuclei:latest
    volumes:
      - scan_output:/data/output
    network_mode: host
    profiles: ["tools"]

  httpx:
    image: projectdiscovery/httpx:latest
    volumes:
      - scan_output:/data/output
    network_mode: host
    profiles: ["tools"]

volumes:
  mysql_data:
  scan_output:
  report_assets:
