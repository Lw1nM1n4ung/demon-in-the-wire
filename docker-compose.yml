services:
  wireghost:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./output:/data/output
    environment:
      - WIREGHOST_OUTPUT_DIR=/data/output
      - HOME=/tmp
    network_mode: host

  nmap:
    image: instrumentisto/nmap:latest
    volumes:
      - ./output:/data/output
    network_mode: host
    profiles: ["tools"]

  nuclei:
    image: projectdiscovery/nuclei:latest
    volumes:
      - ./output:/data/output
    network_mode: host
    profiles: ["tools"]

  httpx:
    image: projectdiscovery/httpx:latest
    volumes:
      - ./output:/data/output
    network_mode: host
    profiles: ["tools"]

  openvas:
    image: greenbone/openvas-scanner:latest
    volumes:
      - openvas_data:/var/lib/openvas
      - gvmd_socket:/run/gvmd
    network_mode: host
    profiles: ["openvas"]

  gvmd:
    image: greenbone/gvmd:latest
    volumes:
      - gvmd_data:/var/lib/gvm
      - gvmd_socket:/run/gvmd
      - openvas_data:/var/lib/openvas
    environment:
      - GVMD_USER=admin
      - GVMD_PASSWORD=admin
    network_mode: host
    profiles: ["openvas"]
    depends_on:
      - openvas

  ospd-openvas:
    image: greenbone/ospd-openvas:latest
    volumes:
      - openvas_data:/var/lib/openvas
      - gvmd_socket:/run/gvmd
    network_mode: host
    profiles: ["openvas"]
    depends_on:
      - openvas

volumes:
  openvas_data:
  gvmd_data:
  gvmd_socket:
