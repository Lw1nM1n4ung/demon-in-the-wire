services:
  wireghost:
    build: .
    volumes:
      - scan-data:/data/output
      - ./wireghost.yml:/app/wireghost.yml:ro
    environment:
      - WIREGHOST_OUTPUT_DIR=/data/output
    network_mode: host
    entrypoint: ["wireghost"]

  nmap:
    image: instrumentisto/nmap:latest
    volumes:
      - scan-data:/data/output
    network_mode: host
    profiles: ["tools"]

  nuclei:
    image: projectdiscovery/nuclei:latest
    volumes:
      - scan-data:/data/output
    network_mode: host
    profiles: ["tools"]

  httpx:
    image: projectdiscovery/httpx:latest
    volumes:
      - scan-data:/data/output
    network_mode: host
    profiles: ["tools"]

volumes:
  scan-data:
