networks:
  wireghost_net:
    driver: bridge

services:
  # ══════════════════════════════════════
  # WIRE_GHOST — INFRASTRUCTURE
  # ══════════════════════════════════════

  db:
    image: mysql:8.0
    restart: unless-stopped
    networks: [wireghost_net]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wireghost}
      MYSQL_USER: ${MYSQL_USER:-wireghost}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [wireghost_net]
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ══════════════════════════════════════
  # WIRE_GHOST — APPLICATION
  # ══════════════════════════════════════

  api:
    build:
      context: .
      dockerfile: web_portal/Dockerfile.web
    restart: unless-stopped
    user: "1000:1000"
    networks: [wireghost_net]
    environment: &api-env
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: wireghost
      MYSQL_USER: wireghost
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SETTINGS_MODULE: wireghost_web.settings
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,${WIREGHOST_HOST:-localhost}"
      WIREGHOST_HOST: ${WIREGHOST_HOST:-localhost}
      WIREGHOST_PORT: ${WIREGHOST_PORT:-443}
      WIREGHOST_PROTO: ${WIREGHOST_PROTO:-https}
      WIREGHOST_OUTPUT_DIR: /data/output
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    volumes: &api-vols
      - scan_output:/data/output
      - report_assets:/data/assets
      - ${WIREGHOST_LOG_DIR:-./logs}/api:/app/logs
      - ${WIREGHOST_LOG_DIR:-./logs}/nginx:/app/logs/nginx:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn wireghost_web.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60 --max-requests 1000 --max-requests-jitter 100 --forwarded-allow-ips='*'"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  worker:
    build:
      context: .
      dockerfile: web_portal/Dockerfile
    restart: unless-stopped
    user: "0:0"
    networks: [wireghost_net]
    environment: *api-env
    volumes: *api-vols
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A wireghost_web worker -l info -c 4 --prefetch-multiplier 1 -Q scans,reports --logfile=/app/logs/celery-worker.log
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN, CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"

  beat:
    build:
      context: .
      dockerfile: web_portal/Dockerfile.web
    restart: unless-stopped
    user: "1000:1000"
    networks: [wireghost_net]
    environment: *api-env
    volumes: *api-vols
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A wireghost_web beat -l info --schedule=/app/logs/celerybeat-schedule --logfile=/app/logs/celery-beat.log
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  bot:
    build: { context: ., dockerfile: web_portal/Dockerfile.web }
    restart: unless-stopped
    user: "1000:1000"
    networks: [wireghost_net]
    environment: *api-env
    volumes: *api-vols
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: python manage.py telegrambot
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  portal:
    image: nginx:alpine
    restart: unless-stopped
    networks: [wireghost_net]
    ports:
      - "0.0.0.0:${WIREGHOST_PORT:-443}:443"
      - "0.0.0.0:${WIREGHOST_HTTP_PORT:-80}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ${WIREGHOST_LOG_DIR:-./logs}/nginx:/var/log/nginx
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ══════════════════════════════════════
  # WIRE_GHOST — SCAN TOOLS (optional)
  # ══════════════════════════════════════

  wireghost:
    image: callmedemon/wireghost:latest
    build: .
    volumes:
      - scan_output:/data/output
    network_mode: host
    profiles: ["tools"]

  nmap:
    image: instrumentisto/nmap:latest
    volumes:
      - scan_output:/data/output
    network_mode: host
    profiles: ["tools"]

  nuclei:
    image: projectdiscovery/nuclei:latest
    volumes:
      - scan_output:/data/output
    network_mode: host
    profiles: ["tools"]

  httpx:
    image: projectdiscovery/httpx:latest
    volumes:
      - scan_output:/data/output
    network_mode: host
    profiles: ["tools"]

volumes:
  mysql_data:
  scan_output:
  report_assets:
