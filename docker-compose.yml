services:
  wireghost:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./output:/data/output
    environment:
      - WIREGHOST_OUTPUT_DIR=/data/output
      - HOME=/tmp
    network_mode: host

  nmap:
    image: instrumentisto/nmap:latest
    volumes:
      - ./output:/data/output
    network_mode: host
    profiles: ["tools"]

  nuclei:
    image: projectdiscovery/nuclei:latest
    volumes:
      - ./output:/data/output
    network_mode: host
    profiles: ["tools"]

  httpx:
    image: projectdiscovery/httpx:latest
    volumes:
      - ./output:/data/output
    network_mode: host
    profiles: ["tools"]
