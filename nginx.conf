server_tokens off;  # Hide nginx version

# Single server block — accepts any Host header on port 80.
# Port 80 inside the container is mapped to 0.0.0.0:9995 on the host.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;

    # Keep Location headers relative so the browser preserves its original
    # host:port (we listen on :80 inside the container but are published on
    # :9995 on the host — absolute redirects would drop the port).
    absolute_redirect off;

    # Portal-wide security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    # Block sensitive files
    location ~ (Dockerfile|\.dockerignore|\.git|\.env|\.md$) {
        return 404;
    }

    # Block Django admin — case-insensitive, handles path tricks
    location ~* ^/admin {
        return 404;
    }

    # ═══════════════════════════════════════════════════════════════════
    # Tier 0 — PUBLIC (no auth_request gate)
    # These entry points must work for unauthenticated visitors so first-
    # install, login, and CSS/font assets can load.
    # ═══════════════════════════════════════════════════════════════════

    # Login shell
    location = /login {
        try_files /login.html =404;
    }

    # First-install setup wizard (Tier 0 because it runs BEFORE any user
    # exists; the Django /api/auth/setup-admin/ endpoint refuses if setup
    # is already complete, so this doesn't expose the wizard post-install).
    location = /setup {
        try_files /setup.html =404;
    }

    # Public JS tier — login boot, theme, state, the api wrapper.
    location /js/public/ {
        try_files $uri =404;
    }

    # Third-party libs (d3, Chart.js) — no Wire_Ghost-specific info.
    location /js/lib/ {
        try_files $uri =404;
    }

    # CSS — not sensitive, served to everyone.
    location /css/ {
        try_files $uri =404;
    }

    # ═══════════════════════════════════════════════════════════════════
    # auth_request target — lightweight session probe against Django.
    # Returns 204 if sessionid cookie is valid, 401 otherwise. Cheap.
    # ═══════════════════════════════════════════════════════════════════

    location = /_auth_check {
        internal;
        proxy_pass              http://api:8000/api/auth/check/;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host $host;
        proxy_set_header        Cookie $http_cookie;
        proxy_set_header        X-Original-URI $request_uri;
    }

    # ═══════════════════════════════════════════════════════════════════
    # Tier 1 — AUTHENTICATED ONLY
    # /js/app/ covers router, auth helpers, utils, components, and every
    # page module. Any request without a valid session cookie gets 403 —
    # the files never leave the server.
    # ═══════════════════════════════════════════════════════════════════

    location /js/app/ {
        auth_request /_auth_check;
        error_page 401 403 = @forbidden_js;
        try_files $uri =404;
    }
    location @forbidden_js {
        add_header Cache-Control "no-store" always;
        return 403;
    }

    # ═══════════════════════════════════════════════════════════════════
    # SPA entry + History API fallback.
    # Authenticated users fall through to /app.html; unauthenticated users
    # get a 302 to /login (which also handles setup redirect via JS).
    # ═══════════════════════════════════════════════════════════════════

    location / {
        auth_request /_auth_check;
        error_page 401 = @gate_to_login;
        # Drop `$uri/` from the fallback chain: for GET / it matches the
        # root dir, and with no `index` directive + autoindex off nginx
        # raises 403 before reaching the /app.html fallback. Plain
        # `$uri -> /app.html` gives us the correct SPA-History behavior:
        # serve the static file if it exists, else ship the app shell.
        try_files $uri /app.html;
    }
    location @gate_to_login {
        # Preserve the attempted path so login-boot can bounce the user back.
        # $http_host carries the browser's original host:port (e.g.
        # "95.111.251.53:9995") — nginx would otherwise drop the port
        # because the container listens on :80 internally.
        return 302 $scheme://$http_host/login?next=$uri;
    }

    # ═══════════════════════════════════════════════════════════════════
    # Django REST API proxy.
    # ═══════════════════════════════════════════════════════════════════

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 10M;
        proxy_cookie_path / /;

        # API response headers override the portal CSP with a tighter one.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # Django collected static (admin assets, etc. — admin is blocked but
    # keep the path live for future uses like DRF browsable API).
    location /static/ {
        proxy_pass http://api:8000;
    }
}
