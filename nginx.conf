server_tokens off;

# ═══════════════════════════════════════════════════════════════════
# HTTP → HTTPS redirect
# ═══════════════════════════════════════════════════════════════════
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host:2007$request_uri;
}

# ═══════════════════════════════════════════════════════════════════
# HTTPS server (serves app on port 2007 externally via 0.0.0.0:2007:443)
# ═══════════════════════════════════════════════════════════════════
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # TLS certificates (self-signed, volume-mounted from ./certs)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Use Docker's embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;

    root /usr/share/nginx/html;
    absolute_redirect off;
    autoindex off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Block sensitive files
    location ~ (Dockerfile|\.dockerignore|\.git|\.env|\.md$) {
        return 404;
    }

    # Block Django admin
    location ~* ^/admin {
        return 404;
    }

    # Public locations
    location = /login {
        add_header Cache-Control "no-store" always;
        try_files /login.html =404;
    }

    location = /setup {
        add_header Cache-Control "no-store" always;
        try_files /setup.html =404;
    }

    location /js/public/ { try_files $uri =404; }
    location /css/ { try_files $uri =404; }

    # auth_request target
    location = /_auth_check {
        internal;
        proxy_pass              http://$api_upstream/api/auth/check/;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host $http_host;
        proxy_set_header        Cookie $http_cookie;
        proxy_set_header        X-Original-URI $request_uri;
    }

    # Authenticated JS assets
    location /js/lib/ {
        sendfile off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /js/app/ {
        sendfile off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # SPA entry + History API fallback
    location / {
        auth_request /_auth_check;
        error_page 401 = @gate_to_login;
        add_header Cache-Control "no-store" always;
        try_files $uri /app.html;
    }

    location @gate_to_login {
        return 302 https://$host:2007/login?next=$uri;
    }

    # Django REST API proxy
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 10M;
        proxy_cookie_path / /;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location /static/ {
        proxy_pass http://$api_upstream;
    }
}
