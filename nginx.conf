server_tokens off;  # Hide nginx version

# Default server — reject unknown hosts
server {
    listen 80 default_server;
    server_name _;
    return 444;  # close connection with no response
}

server {
    listen 80;
    server_name localhost 127.0.0.1 95.111.251.53;

    # Frontend portal
    root /usr/share/nginx/html;
    index index.html;

    # Block sensitive files
    location ~ (Dockerfile|\.dockerignore|\.git|\.env|\.md$) {
        return 404;
    }

    # Block Django admin — case-insensitive, handles path tricks
    location ~* ^/admin {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
    }

    # Proxy API requests to Django
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 10M;
        proxy_cookie_path / /;

        # API security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location /static/ {
        proxy_pass http://api:8000;
    }
}
